<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 200 1000 400" role="img" aria-labelledby="title description">
  <title id="title">MetaFOA: a compact path to 360-degree audio</title>
  <desc id="description">A sound field is represented as audio and spatial information, then combined for 360-degree listening.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#EDF4E8"/>
    </linearGradient>
    <radialGradient id="sphere">
      <stop stop-color="#F7FAF5"/>
      <stop offset="1" stop-color="#DCEBCF"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#7A949A" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect y="200" width="1000" height="400" rx="36" fill="url(#paper)"/>
  <circle cx="895" cy="205" r="125" fill="#E4EFD9" opacity=".65"/>
  <circle cx="35" cy="615" r="145" fill="#DCEBF0" opacity=".55"/>
  <g font-family="Arial, sans-serif" fill="#2D4059">
    <g fill="none" stroke="#7A949A" stroke-width="3" marker-end="url(#arrow)">
      <path d="M285 350H320V295H362"/>
      <path d="M320 350V460H362"/>
      <path d="M635 295H675V350H723"/>
      <path d="M635 460H675V350" marker-end="none"/>
    </g>
    <circle cx="320" cy="350" r="5" fill="#7A949A"/>

    <g transform="translate(176 350)">
      <circle r="102" fill="url(#sphere)" stroke="#7C9C7C" stroke-width="2"/>
      <g fill="none" stroke="#88A58A" stroke-width="1.6">
        <ellipse rx="102" ry="34"/>
        <ellipse rx="102" ry="72"/>
        <ellipse rx="35" ry="102"/>
        <ellipse rx="73" ry="102"/>
        <path d="M-102 0H102M0-102V102"/>
      </g>
      <path d="M-67 4H-52L-40-16-24 29-7-40 9 38 26-26 41 16 54 4H67" fill="none" stroke="#4F6F52" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-80" cy="-67" r="7" fill="#EA5455"/>
      <circle cx="89" cy="42" r="6" fill="#6D94A8"/>
    </g>
    <text x="176" y="500" text-anchor="middle" font-size="32" font-weight="700">Sound field</text>

    <rect x="367" y="235" width="268" height="125" rx="22" fill="#E1EEF3" stroke="#B7D0DC" stroke-width="2"/>
    <text x="501" y="309" text-anchor="middle" font-size="32" font-weight="700">Audio codec</text>

    <rect x="367" y="395" width="268" height="130" rx="22" fill="#E8F3D6" stroke="#BFD0A8" stroke-width="2"/>
    <text x="501" y="471" text-anchor="middle" font-size="34" font-weight="700">MetaFOA</text>

    <g transform="translate(829 350)">
      <circle r="94" fill="#FDFBF7" stroke="#C5D9D8" stroke-width="2"/>
      <ellipse rx="113" ry="38" fill="none" stroke="#A0C3D2" stroke-width="2" transform="rotate(-25)"/>
      <ellipse rx="45" ry="104" fill="none" stroke="#C5D9D8" stroke-width="1.5" transform="rotate(25)"/>
      <path d="M-48 16V-9A48 48 0 0 1 48-9V16" fill="none" stroke="#2D4059" stroke-width="9" stroke-linecap="round"/>
      <rect x="-56" y="0" width="20" height="42" rx="9" fill="#4F6F52"/>
      <rect x="36" y="0" width="20" height="42" rx="9" fill="#4F6F52"/>
      <path d="M-23 3V-8A23 23 0 0 1 23-8V3C23 28 12 41 0 41S-23 28-23 3Z" fill="#E8F3D6" stroke="#91A590" stroke-width="2"/>
      <circle cx="82" cy="-65" r="7" fill="#EA5455"/>
    </g>
    <text x="829" y="500" text-anchor="middle" font-size="32" font-weight="700">360° listening</text>
  </g>
</svg>
